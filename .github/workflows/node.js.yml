name: Extension CI

on:
  pull_request:
    branches: [main, dev]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main, dev]
  merge_group:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: extension-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked dependencies
        run: test -f bun.lock && bun install --frozen-lockfile
      - name: Unit and integration tests
        run: bun run test
      - name: Release guard regression tests
        run: bun run test:release
      - name: Chrome publication guard regressions (offline only)
        run: bun run test:cws
      - name: TypeScript
        run: bun run compile
      - name: Chrome MV3 build
        run: bun run build
      - name: Firefox MV2 build
        run: bun run build:firefox
      - name: Package and verify both browsers
        run: bun run release:package
