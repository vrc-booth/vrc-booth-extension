name: Extension CI

on:
  pull_request:
    branches: [main, dev]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main, dev]
  merge_group:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: extension-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Unit and integration tests
        run: pnpm test
      - name: Release guard regression tests
        run: pnpm test:release
      - name: TypeScript
        run: pnpm compile
      - name: Chrome MV3 build
        run: pnpm build
      - name: Firefox MV2 build
        run: pnpm build:firefox
      - name: Package and verify both browsers
        run: pnpm release:package
