name: Prepare immutable Chrome candidate (no store access)

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact main SHA used by this workflow dispatch
        required: true
        type: string
      expected_version:
        description: Canonical X.Y.Z candidate version
        required: true
        type: string
      chrome_qa_record:
        description: Completed Chrome-only QA JSON for this exact SHA; no credentials
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: prepare-chrome-${{ inputs.candidate_sha }}
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Bind source and workflow provenance
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          [[ "$CANDIDATE_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$CANDIDATE_SHA" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          git merge-base --is-ancestor "$CANDIDATE_SHA" origin/main
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.19.0
          cache: pnpm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Require Chrome installation QA and an unused version
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          EXPECTED_VERSION: ${{ inputs.expected_version }}
          QA_RECORD: ${{ inputs.chrome_qa_record }}
        run: |
          mkdir -p dist
          node scripts/release.mjs chrome-gate
      - run: pnpm install --frozen-lockfile
      - name: Validate and build the immutable Chrome package once
        run: |
          pnpm test
          pnpm test:release
          pnpm test:cws
          pnpm compile
          pnpm release:chrome:package
          python3 -B scripts/release-packages.py --normalize --chrome-only --release-ready
          cp CHANGELOG.md dist/CHANGELOG.md
      - name: Read exact package names
        id: release
        run: node scripts/release.mjs metadata
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: boothplus-chrome-${{ steps.release.outputs.version }}-${{ inputs.candidate_sha }}
          if-no-files-found: error
          retention-days: 90
          path: |
            ${{ steps.release.outputs.chrome }}
            ${{ steps.release.outputs.sources }}
            dist/release-manifest.json
            dist/release-qa.json
            dist/SHA256SUMS
            dist/CHANGELOG.md
